<!doctype html>
<html lang="en">
<head><title>Garlic Butter Rice</title></head>
<body>
  <div itemscope itemtype="http://schema.org/Recipe">
    <h1 itemprop="name">Garlic Butter Rice</h1>
    <img itemprop="image" src="/images/rice.jpg" alt="rice" />
    <meta itemprop="prepTime" content="PT5M" />
    <time itemprop="cookTime" datetime="PT20M">20 minutes</time>
    <span itemprop="recipeYield">3 servings</span>
    <ul>
      <li itemprop="recipeIngredient">200 g long-grain rice</li>
      <li itemprop="recipeIngredient">2 tbsp butter</li>
      <li itemprop="recipeIngredient">3 cloves garlic, minced</li>
    </ul>
    <div itemprop="recipeInstructions">
      <ol>
        <li>Melt the butter and fry the garlic for 1 minute.</li>
        <li>Add rice and 400 ml water, cover and simmer for 18 minutes.</li>
      </ol>
    </div>
  </div>
</body>
</html>
