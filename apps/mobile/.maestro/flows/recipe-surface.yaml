appId: com.recipe.app
---
# Best-effort recipe surface. Selectors are optional because a clean install has
# no API recipes, and Expo Go cannot complete import → review against the API.
- launchApp
- tapOn:
    text: Skip
    optional: true
- assertVisible: LAST UPLOADED
- assertVisible: MY RECIPES
- tapOn:
    text: Add your first recipe
    optional: true
- assertVisible:
    text: Send me anything.
    optional: true
- tapOn:
    text: Website
    optional: true
- assertVisible:
    text: Turn into a recipe
    optional: true
- tapOn:
    id: recipe-card-.*
    optional: true
- assertVisible:
    text: NUTRITION
    optional: true
- tapOn:
    text: Per 100g
    optional: true
- assertVisible:
    text: NOTES
    optional: true
- assertVisible:
    text: COLLECTIONS
    optional: true
- tapOn:
    text: Rate 5 stars
    optional: true
- tapOn:
    text: Revision history
    optional: true
- assertVisible:
    text: Restoring never deletes newer versions. It creates a new revision.
    optional: true
- tapOn:
    text: Edit the extraction
    optional: true
- assertVisible:
    text: Save recipe
    optional: true
