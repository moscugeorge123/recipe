appId: com.recipe.app
---
# Recipes wordmark → profile → capture chooser.
# Best-effort shell flow. Expo Go cannot reliably open API-backed screens.
- launchApp
- tapOn:
    text: Skip
    optional: true
- assertVisible: Recipe
- assertVisible: Cookbooks
- tapOn: Profile
- assertVisible: Units
- assertVisible: Reduce motion
- tapOn: Back
- tapOn:
    text: Capture a recipe
    optional: true
- assertVisible:
    text: Add a Recipe
    optional: true
